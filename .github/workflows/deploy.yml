name: Deploy to GitHub Pages

# Publishes the static Next.js export to GitHub Pages.
# 走行タイミング：main への push／手動実行／約15分ごと（スプレッドシート取り込み用）。
# ビルド前に Googleスプレッドシートから最新データを取得してから公開します。
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *" # 約15分ごとにシートを取得して再公開

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Googleスプレッドシート（公開CSV）から最新データを取得して data/*.json を更新。
      # 失敗しても直前のデータでビルドを続行（公開は止めない）。
      - name: Refresh data from Google Sheets (non-blocking)
        continue-on-error: true
        env:
          GUIDE_CSV_URL: ${{ vars.GUIDE_CSV_URL }}
          SCHEDULE_CSV_URL: ${{ vars.SCHEDULE_CSV_URL }}
          THERAPISTS_CSV_URL: ${{ vars.THERAPISTS_CSV_URL }}
        run: node scripts/fetch-sheets.mjs

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # GA4 測定ID。Settings → Secrets and variables → Actions → Variables に
          # NEXT_PUBLIC_GA_ID (例: G-XXXXXXXXXX) を登録すると計測が有効化される。
          # 未登録のうちは空文字となり、解析タグは出力されない（無害）。
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

      - name: Disable Jekyll (serve _next as-is)
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
