name: Update schedule data from Google Sheets

# Googleスプレッドシート（ウェブ公開CSV）から出勤情報・案内状況を取得し、
# data/*.json を更新して push します。push により deploy.yml が動き、サイトへ反映されます。

on:
  schedule:
    - cron: "*/15 * * * *" # 約15分ごと（GitHub の都合で多少前後します）
  workflow_dispatch: {}

# 直近の実行だけを有効化（重複実行を防止）
concurrency:
  group: update-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch sheets → data/*.json
        env:
          GUIDE_CSV_URL: ${{ vars.GUIDE_CSV_URL }}
          SCHEDULE_CSV_URL: ${{ vars.SCHEDULE_CSV_URL }}
          THERAPISTS_CSV_URL: ${{ vars.THERAPISTS_CSV_URL }}
        run: node scripts/fetch-sheets.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data)" ]; then
            git add data
            git commit -m "chore(data): update schedule/guide from Google Sheets"
            git push
            echo "data updated and pushed."
          else
            echo "no data changes."
          fi
