<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <base target="_top" />
  <style>
    :root { --wine:#6e1324; --wine2:#8a1a30; --gold:#c9a24a; --ink:#2a2420; --line:#e4dccb; --bg:#f6f2ea; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
    header { position:sticky; top:0; z-index:10; background:linear-gradient(180deg,var(--wine2),var(--wine)); color:#fff; padding:10px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    header h1 { font-size:15px; margin:0; letter-spacing:.04em; }
    header .me { margin-left:auto; font-size:11px; opacity:.85; }
    .bar { background:#fff; border-bottom:1px solid var(--line); padding:8px 10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .bar label { font-size:11px; color:#6b5d44; display:flex; flex-direction:column; gap:2px; }
    input, select, textarea { font-size:14px; padding:8px; border:1px solid #cfc6b3; border-radius:8px; background:#fff; color:var(--ink); }
    button { font-size:14px; padding:9px 12px; border-radius:8px; border:1px solid var(--gold); background:#fff; color:var(--wine); font-weight:700; cursor:pointer; }
    button.primary { background:linear-gradient(180deg,var(--wine2),var(--wine)); color:#fff; border-color:var(--wine); }
    button.ghost { border-color:#cfc6b3; color:#6b5d44; }
    button.danger { border-color:#b53a2b; color:#b53a2b; }
    button:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
    main { padding:10px; max-width:860px; margin:0 auto; }
    .summary { font-size:12px; color:#6b5d44; margin:4px 2px 10px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(60,40,30,.07); }
    .card .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .time { font-weight:700; font-size:15px; }
    .pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; border:1px solid transparent; }
    .st-tentative { background:#fff6e2; color:#9a6a00; border-color:#e8cf8f; }
    .st-confirmed { background:#e7f6ec; color:#1b7a3d; border-color:#a9dcb9; }
    .st-cancelled { background:#f1f1f1; color:#777; border-color:#ddd; text-decoration:line-through; }
    .st-expired { background:#fbeceb; color:#a23; border-color:#eac3bf; }
    .src { font-size:11px; color:#6b5d44; border:1px solid #d9cfb8; border-radius:6px; padding:1px 6px; }
    .rep { font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; border:1px solid transparent; }
    .rep.new { background:#eef2f7; color:#5a6b80; border-color:#cfdae6; }       /* 初回 */
    .rep.again { background:#fbeede; color:#9a5b00; border-color:#e8c488; }      /* リピーター */
    .meta { font-size:12px; color:#52473a; margin-top:4px; line-height:1.7; }
    .row-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .row-actions button { padding:6px 10px; font-size:12.5px; }
    .empty, .err { text-align:center; color:#8a7c64; padding:24px; }
    .err { color:#b53a2b; }
    /* モーダル */
    .modal-bg { position:fixed; inset:0; background:rgba(30,20,20,.5); display:none; align-items:flex-start; justify-content:center; z-index:50; padding:16px; overflow:auto; }
    .modal-bg.on { display:flex; }
    .modal { background:#fff; border-radius:12px; max-width:460px; width:100%; padding:16px; margin-top:24px; }
    .modal h2 { font-size:16px; margin:0 0 10px; color:var(--wine); }
    .field { display:flex; flex-direction:column; gap:3px; margin-bottom:10px; }
    .field label { font-size:12px; color:#6b5d44; }
    .field .two { display:flex; gap:8px; }
    .field .two > * { flex:1; }
    .modal-actions { display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; margin-top:6px; }
    .note { font-size:11.5px; color:#8a7c64; }
    .toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:#2a2420; color:#fff; padding:10px 16px; border-radius:24px; font-size:13px; z-index:80; opacity:0; transition:opacity .2s; pointer-events:none; }
    .toast.on { opacity:.96; }
    .loading { text-align:center; color:#8a7c64; padding:20px; }
    /* 表示切替 */
    .vtoggle { padding:8px 12px; background:#fff; color:var(--wine); font-weight:700; }
    .vtoggle.on { background:linear-gradient(180deg,var(--wine2),var(--wine)); color:#fff; }
    /* タイムテーブル */
    .tt-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; background:#fff; }
    table.tt { border-collapse:collapse; width:100%; font-size:12px; }
    table.tt th, table.tt td { border:1px solid #ece4d3; }
    table.tt thead th { position:sticky; top:0; background:#f3ece0; color:#5a4a33; padding:6px 4px; z-index:2; white-space:nowrap; }
    table.tt th.tcol { position:sticky; left:0; background:#f3ece0; z-index:3; }
    table.tt td.tlabel { position:sticky; left:0; background:#faf6ee; color:#7a6a4a; font-size:11px; text-align:center; width:52px; white-space:nowrap; z-index:1; }
    table.tt td.cell { height:22px; min-width:92px; cursor:pointer; }
    table.tt td.cell.off { background:repeating-linear-gradient(45deg,#f3f1ec,#f3f1ec 6px,#eceae3 6px,#eceae3 12px); cursor:default; }
    table.tt td.cell.free:hover { background:#fff7df; }
    table.tt td.bk { vertical-align:top; padding:3px 5px; color:#2a2420; font-weight:600; cursor:pointer; line-height:1.3; }
    table.tt td.bk small { display:block; font-weight:400; font-size:10.5px; color:#52473a; }
    table.tt td.bk.st-tentative { background:#fff6e2; }
    table.tt td.bk.st-confirmed { background:#e7f6ec; }
    .tt-hint { font-size:11px; color:#8a7c64; margin:6px 2px; }
    /* ページ切替（予約／セラピスト） */
    .ptabs { display:inline-flex; gap:4px; margin-left:8px; }
    .ptab { padding:6px 12px; font-size:13px; background:transparent; color:#f3e6c9; border:1px solid rgba(243,230,201,.5); }
    .ptab.on { background:#fff; color:var(--wine); border-color:#fff; }
    /* 週間出勤表 */
    table.sg { border-collapse:collapse; width:100%; font-size:12px; }
    table.sg th, table.sg td { border:1px solid #ece4d3; }
    table.sg thead th { position:sticky; top:0; background:#f3ece0; color:#5a4a33; padding:6px 4px; white-space:nowrap; z-index:2; }
    table.sg th.nm { position:sticky; left:0; background:#faf6ee; z-index:3; text-align:left; padding:0; min-width:84px; }
    table.sg th.nm button { width:100%; border:none; border-radius:0; background:transparent; text-align:left; padding:8px 6px; font-size:13px; color:var(--wine); text-decoration:underline; }
    table.sg td.sc { height:44px; min-width:84px; padding:3px 4px; vertical-align:top; cursor:pointer; text-align:center; }
    table.sg td.sc:hover { background:#fff7df; }
    table.sg td.sc.on { background:#e7f6ec; }
    table.sg td.sc.off { background:repeating-linear-gradient(45deg,#f3f1ec,#f3f1ec 6px,#eceae3 6px,#eceae3 12px); color:#888; }
    table.sg td.sc.draft { background:#fff6e2; color:#9a6a00; }
    table.sg td.sc .t { font-weight:700; white-space:nowrap; }
    table.sg td.sc small { display:block; font-size:10.5px; color:#6b5d44; }
    table.sg td.sc .plus { color:#c9bfa9; font-size:16px; line-height:36px; }
    table.sg td.sc.today, table.sg th.today { outline:2px solid var(--gold); outline-offset:-2px; }
    .sec-h { font-size:13px; color:var(--wine); font-weight:700; margin:12px 0 4px; border-bottom:1px solid var(--line); padding-bottom:3px; }
    .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:12.5px; }
    .kv dt { color:#8a7c64; } .kv dd { margin:0; word-break:break-all; }
    .li { font-size:12.5px; padding:5px 2px; border-bottom:1px dashed #eee5d2; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .li.click { cursor:pointer; } .li.click:hover { background:#fff7df; }
    .stat { display:inline-block; background:#faf6ee; border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin:2px 4px 2px 0; font-size:12px; }
    .stat b { font-size:16px; color:var(--wine); margin-left:4px; }
  </style>
</head>
<body>
  <header>
    <h1>予約管理 ｜ AROMA DAIAMOND</h1>
    <nav class="ptabs">
      <button class="ptab on" id="tab-bk">予約</button>
      <button class="ptab" id="tab-th">セラピスト</button>
    </nav>
    <span class="me" id="me"></span>
  </header>

  <div id="page-bk">
  <div class="bar">
    <label>日付<input type="date" id="f-date" /></label>
    <label>担当者
      <select id="f-ther"><option value="">すべて</option></select>
    </label>
    <label>状態
      <select id="f-status">
        <option value="">すべて</option>
        <option value="tentative">仮予約</option>
        <option value="confirmed">確定</option>
        <option value="cancelled">キャンセル</option>
        <option value="expired">期限切れ</option>
      </select>
    </label>
    <label>経路
      <select id="f-source">
        <option value="">すべて</option>
        <option value="WEB">WEB</option>
        <option value="LINE">LINE</option>
        <option value="電話">電話</option>
      </select>
    </label>
    <span style="display:inline-flex;border:1px solid var(--gold);border-radius:8px;overflow:hidden">
      <button id="v-list" class="vtoggle on" style="border:none;border-radius:0">一覧</button>
      <button id="v-grid" class="vtoggle" style="border:none;border-radius:0">タイム表</button>
    </span>
    <button class="ghost" id="btn-reload">更新</button>
    <button class="primary" id="btn-new">＋ 手動登録</button>
  </div>

  <main>
    <div class="summary" id="summary"></div>
    <div id="list"><div class="loading">読み込み中…</div></div>
    <div id="timetable" style="display:none"></div>
  </main>
  </div>

  <!-- セラピスト（週間出勤表） -->
  <div id="page-th" style="display:none">
    <div class="bar">
      <button class="ghost" id="th-prev">‹ 前の週</button>
      <label>週の始まり<input type="date" id="th-from" /></label>
      <button class="ghost" id="th-next">次の週 ›</button>
      <button class="ghost" id="th-today">今日</button>
      <button class="ghost" id="th-reload">更新</button>
      <button class="primary" id="th-new">＋ 出勤を登録</button>
    </div>
    <main>
      <div class="summary" id="th-summary"></div>
      <div id="th-grid"><div class="loading">読み込み中…</div></div>
      <p class="tt-hint">マスをタップで出勤の登録・変更／名前をタップで個別ページ。斜線＝休み、黄色＝申請中・希望休（サイト非表示・予約不可）。サイトの出勤表示への反映は最大15分ほどかかります。</p>
    </main>
  </div>

  <!-- 出勤の登録/変更モーダル -->
  <div class="modal-bg" id="sh-bg">
    <div class="modal">
      <h2 id="sh-title">出勤の登録</h2>
      <div class="field"><label>セラピスト（新しい人は名前を入力）</label><input id="sh-name" list="sh-names" autocomplete="off" /><datalist id="sh-names"></datalist></div>
      <div class="field"><label>日付</label><input type="date" id="sh-date" /></div>
      <div class="field"><label>出勤時間（開始〜終了）</label><div class="two"><select id="sh-start"></select><select id="sh-end"></select></div></div>
      <div class="field"><label>サイトの空き表示／区分</label>
        <div class="two">
          <select id="sh-status"><option>空きあり</option><option>残りわずか</option><option>満了</option><option>受付終了</option></select>
          <select id="sh-kbn"><option>確定</option><option>申請中</option><option>希望休</option></select>
        </div>
      </div>
      <p class="note" id="sh-state">※「申請中」「希望休」はサイトに表示されず、WEB・LINEの予約も受け付けません。</p>
      <div class="modal-actions">
        <button class="ghost" id="sh-close">閉じる</button>
        <button class="danger" id="sh-del">削除</button>
        <button class="ghost" id="sh-absent">休みにする</button>
        <button class="primary" id="sh-save">保存</button>
      </div>
    </div>
  </div>

  <!-- セラピスト個別ページ -->
  <div class="modal-bg" id="td-bg">
    <div class="modal" style="max-width:560px">
      <h2 id="td-title">セラピスト</h2>
      <div id="td-body"><div class="loading">読み込み中…</div></div>
      <div class="modal-actions">
        <button class="ghost" id="td-close">閉じる</button>
        <button class="primary" id="td-add">＋ 出勤を登録</button>
      </div>
    </div>
  </div>

  <!-- 登録/編集モーダル -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h2 id="m-title">予約の登録</h2>
      <input type="hidden" id="m-id" />
      <div class="field"><label>担当者</label><select id="m-ther"></select></div>
      <div class="field"><label>日付・開始時刻（翌は「翌2:00」の形式）</label>
        <div class="two"><input type="date" id="m-date" /><input type="text" id="m-time" placeholder="14:00 / 翌2:00" /></div>
      </div>
      <div class="field"><label>コース</label><select id="m-course"></select></div>
      <div class="field"><label>料金（円・任意）</label><input type="number" id="m-price" /></div>
      <div class="field"><label>お客様名</label><input type="text" id="m-name" /></div>
      <div class="field"><label>連絡先</label>
        <div class="two"><input type="tel" id="m-tel" placeholder="電話（任意）" /><input type="email" id="m-email" placeholder="メール（任意）" /></div>
      </div>
      <div class="field"><label>経路</label>
        <select id="m-source"><option value="電話">電話</option><option value="LINE">LINE</option><option value="WEB">WEB</option></select>
      </div>
      <div class="field" id="m-confirm-wrap"><label><input type="checkbox" id="m-confirm" checked /> 確認済みとして「確定」で登録する</label></div>
      <p class="note">※ 同じ担当者で時間が重なる予約、出勤時間を超える予約は登録できません。</p>
      <div class="modal-actions">
        <button class="ghost" id="m-cancel">閉じる</button>
        <button class="primary" id="m-save">保存</button>
      </div>
    </div>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-bg" id="detail-bg">
    <div class="modal">
      <h2>予約の詳細</h2>
      <div id="d-body" class="meta"></div>
      <div class="field" style="margin-top:10px"><label>スタッフメモ</label><textarea id="d-memo" rows="2"></textarea></div>
      <div class="modal-actions">
        <button class="ghost" id="d-close">閉じる</button>
        <button class="ghost" id="d-memo-save">メモ保存</button>
        <button class="primary" id="d-edit">変更</button>
        <button class="primary" id="d-confirm">確定</button>
        <button class="danger" id="d-cancel">キャンセル</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // コース一覧（サイトの data/reserve-config.json と揃える）
    var COURSES = [
      { label: "60分コース", price: 13000 },
      { label: "70分あおむけコース", price: 18000 },
      { label: "90分コース", price: 18000 },
      { label: "120分コース", price: 23000 },
      { label: "150分コース", price: 28000 },
      { label: "延長30分", price: 6000 },
    ];
    var STAFF_EMAIL = "<?= staffEmail ?>";
    var therapists = [];
    var current = {}; // id -> row

    function $(id){ return document.getElementById(id); }
    function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(function(){t.classList.remove("on");},2200); }
    function todayStr(){ var d=new Date(); var p=function(n){return String(n).padStart(2,"0");}; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
    function dateInputToSlash(v){ return v ? v.replace(/-/g,"/").replace(/\/0/g,"/").replace(/^(\d+)\/(\d+)\/(\d+)/,function(_,y,m,d){return y+"/"+(+m)+"/"+(+d);}) : ""; }
    function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    // リピーター表示：電話番号から判定した「◯回目」。電話が無ければ空。
    function repHtml(r){
      if(!r || !r.visitNo) return "";
      return r.visitNo>=2
        ? '<span class="rep again">リピーター '+r.visitNo+'回目</span>'
        : '<span class="rep new">初回</span>';
    }
    function repText(r){
      if(!r || !r.visitNo) return "";
      return r.visitNo>=2 ? ("リピーター "+r.visitNo+"回目（全"+r.visitCount+"回）") : "初回のお客様";
    }

    $("me").textContent = STAFF_EMAIL || "";

    // 初期化
    $("f-date").value = todayStr();
    COURSES.forEach(function(c){
      var o=document.createElement("option"); o.value=c.label; o.textContent=c.label+"（¥"+c.price.toLocaleString()+"）"; $("m-course").appendChild(o);
    });
    $("m-course").addEventListener("change", function(){
      var c=COURSES.filter(function(x){return x.label===this.value;}.bind(this))[0]; if(c) $("m-price").value=c.price;
    });

    google.script.run.withSuccessHandler(function(r){
      therapists = (r&&r.therapists)||[];
      var opts = '<option value="">すべて</option>';
      var mopts = "";
      therapists.forEach(function(t){
        opts += '<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>';
        mopts += '<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>';
      });
      $("f-ther").innerHTML = opts;
      $("m-ther").innerHTML = mopts;
      load();
    }).withFailureHandler(function(e){ fail(e); }).adminTherapists();

    function fail(e){ $("list").innerHTML='<div class="err">'+esc(e&&e.message?e.message:e)+'</div>'; }

    function load(){
      $("list").innerHTML='<div class="loading">読み込み中…</div>';
      var params = { dateStr: dateInputToSlash($("f-date").value), therapistId:$("f-ther").value, status:$("f-status").value, source:$("f-source").value };
      google.script.run.withSuccessHandler(render).withFailureHandler(fail).adminList(params);
    }

    function render(res){
      if(!res||!res.ok){ fail((res&&res.reason)||"取得に失敗しました"); return; }
      var rows=res.rows||[]; current={};
      $("summary").textContent = rows.length+" 件（確定 "+rows.filter(function(r){return r.status==="confirmed";}).length+" / 仮予約 "+rows.filter(function(r){return r.status==="tentative";}).length+"）";
      if(!rows.length){ $("list").innerHTML='<div class="empty">この条件の予約はありません。</div>'; return; }
      var html="";
      rows.forEach(function(r){
        current[r.id]=r;
        var t = r.start.split(" ")[1]+"〜"+r.end.split(" ")[1];
        html += '<div class="card">'
          + '<div class="top"><span class="time">'+esc(t)+'</span>'
          + '<span class="pill st-'+esc(r.status)+'">'+esc(r.statusLabel)+'</span>'
          + '<span class="src">'+esc(r.source)+'</span>'
          + repHtml(r)
          + '<span style="margin-left:auto;font-weight:700">'+esc(r.therapistName)+'</span></div>'
          + '<div class="meta">'+esc(r.customerName||"（名前なし）")+'　'+esc(r.course||"")+'　'+(r.price?("¥"+Number(r.price).toLocaleString()):"")
          + (r.tel?'　☎ '+esc(r.tel):'')+(r.email?'　✉ '+esc(r.email):'')
          + (r.staffMemo?'<br>📝 '+esc(r.staffMemo):'')+'</div>'
          + '<div class="row-actions"><button class="ghost" onclick="openDetail(\''+esc(r.id)+'\')">詳細</button></div>'
          + '</div>';
      });
      $("list").innerHTML=html;
    }

    // ---- 詳細 ----
    window.openDetail=function(id){
      var r=current[id]; if(!r) return;
      $("d-body").innerHTML =
        "<b>"+esc(r.therapistName)+"</b>　<span class='pill st-"+esc(r.status)+"'>"+esc(r.statusLabel)+"</span>　<span class='src'>"+esc(r.source)+"</span>　"+repHtml(r)+"<br>"
        +(repText(r)?("来店 "+esc(repText(r))+"<br>"):"")
        +"開始 "+esc(r.start)+"<br>終了 "+esc(r.end)+"（"+esc(r.durationMin)+"分）<br>"
        +"コース "+esc(r.course||"")+"　料金 "+(r.price?("¥"+Number(r.price).toLocaleString()):"-")+"<br>"
        +"お客様 "+esc(r.customerName||"-")+"<br>連絡先 "+esc(r.tel||"-")+" / "+esc(r.email||"-")+(r.lineUserId?(" / LINE:"+esc(r.lineUserId)):"")+"<br>"
        +"最終更新 "+esc(r.updatedAt||"")+"（"+esc(r.updatedBy||"")+"）<br>ID "+esc(r.id);
      $("d-memo").value=r.staffMemo||"";
      $("d-confirm").style.display = (r.status==="tentative")?"inline-block":"none";
      $("d-edit").style.display = (r.status==="cancelled"||r.status==="expired")?"none":"inline-block";
      $("d-cancel").style.display = (r.status==="cancelled")?"none":"inline-block";
      $("detail-bg").dataset.id=id;
      $("detail-bg").classList.add("on");
    };
    $("d-close").onclick=function(){ $("detail-bg").classList.remove("on"); };
    $("d-memo-save").onclick=function(){
      var id=$("detail-bg").dataset.id;
      runOp(function(cb,fb){ google.script.run.withSuccessHandler(cb).withFailureHandler(fb).adminMemo(id,$("d-memo").value); },"メモを保存しました");
    };
    $("d-confirm").onclick=function(){
      var id=$("detail-bg").dataset.id;
      runOp(function(cb,fb){ google.script.run.withSuccessHandler(cb).withFailureHandler(fb).adminConfirm(id); },"確定しました");
    };
    $("d-cancel").onclick=function(){
      var id=$("detail-bg").dataset.id;
      if(!confirm("この予約をキャンセルします。よろしいですか？（履歴には残ります）")) return;
      var reason=prompt("キャンセル理由（任意）","")||"";
      runOp(function(cb,fb){ google.script.run.withSuccessHandler(cb).withFailureHandler(fb).adminCancel(id,reason); },"キャンセルしました");
    };
    $("d-edit").onclick=function(){ var id=$("detail-bg").dataset.id; $("detail-bg").classList.remove("on"); openEdit(id); };

    function runOp(fn, okMsg){
      fn(function(res){
        if(res&&res.ok){ toast(okMsg); $("detail-bg").classList.remove("on"); $("modal-bg").classList.remove("on"); refresh(); }
        else { alert("できませんでした：" + ((res&&res.reason)||"不明")); }
      }, function(e){ alert("エラー：" + (e&&e.message?e.message:e)); });
    }

    // ---- 登録/編集 ----
    $("btn-new").onclick=function(){ openEdit(null); };
    function openEdit(id){
      var r = id?current[id]:null;
      $("m-title").textContent = id?"予約の変更":"予約の登録";
      $("m-id").value = id||"";
      $("m-ther").value = r?r.therapistId:(therapists[0]&&therapists[0].id)||"";
      if(r){ var parts=r.start.split(" "); $("m-date").value=parts[0].replace(/\//g,"-").replace(/-(\d)(?=-|$)/g,"-0$1"); $("m-time").value=parts[1]; }
      else { $("m-date").value=$("f-date").value; $("m-time").value=""; }
      $("m-course").value=r?r.course:COURSES[0].label;
      $("m-price").value=r?r.price:COURSES[0].price;
      $("m-name").value=r?r.customerName:"";
      $("m-tel").value=r?r.tel:"";
      $("m-email").value=r?r.email:"";
      $("m-source").value=r?r.source:"電話";
      $("m-confirm-wrap").style.display = id?"none":"block"; // 変更時は確定チェック非表示
      $("modal-bg").classList.add("on");
    }
    $("m-cancel").onclick=function(){ $("modal-bg").classList.remove("on"); };
    $("m-save").onclick=function(){
      var id=$("m-id").value;
      var therName = (therapists.filter(function(t){return t.id===$("m-ther").value;})[0]||{}).name || $("m-ther").value;
      var payload = {
        therapistId:$("m-ther").value, therapistName:therName,
        dateStr: dateInputToSlash($("m-date").value), timeLabel:$("m-time").value.trim(),
        course:$("m-course").value, price:$("m-price").value?Number($("m-price").value):"",
        customerName:$("m-name").value.trim(), tel:$("m-tel").value.trim(), email:$("m-email").value.trim(),
      };
      if(!payload.timeLabel){ alert("開始時刻を入力してください（例 14:00 / 翌2:00）"); return; }
      if(id){
        runOp(function(cb,fb){ google.script.run.withSuccessHandler(cb).withFailureHandler(fb).adminUpdate(id,payload); },"変更しました");
      } else {
        payload.source=$("m-source").value;
        payload.asConfirmed=$("m-confirm").checked;
        runOp(function(cb,fb){ google.script.run.withSuccessHandler(cb).withFailureHandler(fb).adminCreate(payload); },"登録しました");
      }
    };

    // ---- タイムテーブル表示 ----
    var view = "list";
    // lib.gs の gridPlacement と同一ロジック（クライアント用に複製）
    function gridPlacement(startMin,endMin,openMin,stepMin,rowCount){
      if(startMin==null||endMin==null) return null;
      if(endMin<=openMin) return null;
      var closeMin=openMin+rowCount*stepMin;
      if(startMin>=closeMin) return null;
      var s=Math.floor((Math.max(startMin,openMin)-openMin)/stepMin);
      var e=Math.ceil((Math.min(endMin,closeMin)-openMin)/stepMin);
      s=Math.max(0,Math.min(s,rowCount-1));
      e=Math.max(s+1,Math.min(e,rowCount));
      return {startIdx:s,span:e-s};
    }
    function minLabel(min){ var h=Math.floor(min/60),m=min%60; var p=function(n){return String(n).padStart(2,"0");}; return (h>=24?("翌"+(h-24)):h)+":"+p(m); }

    function loadTimetable(){
      $("timetable").innerHTML='<div class="loading">読み込み中…</div>';
      google.script.run
        .withSuccessHandler(renderTimetable)
        .withFailureHandler(function(e){ $("timetable").innerHTML='<div class="err">'+esc(e&&e.message?e.message:e)+'</div>'; })
        .adminTimetable(dateInputToSlash($("f-date").value));
    }

    function renderTimetable(res){
      if(!res||!res.ok){ $("timetable").innerHTML='<div class="err">'+esc((res&&res.reason)||"取得に失敗しました")+'</div>'; return; }
      var open=res.openMin, step=res.step, rowCount=Math.round((res.closeMin-open)/step);
      var ths=res.therapists||[];
      current={}; (res.bookings||[]).forEach(function(b){ current[b.id]=b; });
      if(!ths.length){ $("timetable").innerHTML='<div class="empty">この日に出勤・予約のある担当者がいません。</div>'; $("summary").textContent=""; return; }
      $("summary").textContent = ths.length+"名 / 予約 "+res.bookings.length+"件";
      // 列ごとの配置（colMap[thIdx][rowIdx] = {kind:'bk',booking,span} or 'skip'）
      var cols = ths.map(function(){ return {}; });
      ths.forEach(function(t,ti){
        res.bookings.filter(function(b){return String(b.therapistId)===String(t.id);}).forEach(function(b){
          var g=gridPlacement(b.startMin,b.endMin,open,step,rowCount); if(!g) return;
          cols[ti][g.startIdx]={kind:'bk',booking:b,span:g.span};
          for(var k=1;k<g.span;k++) cols[ti][g.startIdx+k]='skip';
        });
      });
      var html='<div class="tt-wrap"><table class="tt"><thead><tr><th class="tcol">時間</th>';
      ths.forEach(function(t){ html+='<th>'+esc(t.name)+'</th>'; });
      html+='</tr></thead><tbody>';
      for(var r=0;r<rowCount;r++){
        var min=open+r*step;
        html+='<tr><td class="tlabel">'+esc(minLabel(min))+'</td>';
        for(var ti=0;ti<ths.length;ti++){
          var t=ths[ti], cell=cols[ti][r];
          if(cell==='skip') continue; // rowspanで覆われている
          if(cell&&cell.kind==='bk'){
            var b=cell.booking;
            html+='<td class="bk st-'+esc(b.status)+'" rowspan="'+cell.span+'" onclick="openDetail(\''+esc(b.id)+'\')">'
              +esc(b.customerName||"（名前なし）")+(b.visitNo&&b.visitNo>=2?' <span class="rep again">'+b.visitNo+'回目</span>':'')
              +'<small>'+esc(b.course||"")+' / '+esc(b.statusLabel)+' / '+esc(b.source)+'</small></td>';
          } else {
            var inShift = (t.shiftStartMin!=null && t.shiftEndMin!=null) ? (min>=t.shiftStartMin && min<t.shiftEndMin) : true;
            if(inShift) html+='<td class="cell free" onclick="openNewAt(\''+esc(t.id)+'\',\''+esc(minLabel(min))+'\')"></td>';
            else html+='<td class="cell off"></td>';
          }
        }
        html+='</tr>';
      }
      html+='</tbody></table></div><div class="tt-hint">空きマスをタップで手動登録／予約マスをタップで詳細。斜線は出勤時間外。</div>';
      $("timetable").innerHTML=html;
    }

    window.openNewAt=function(therapistId, timeLabel){
      openEdit(null);
      $("m-ther").value=therapistId;
      $("m-time").value=timeLabel;
      $("m-date").value=$("f-date").value;
    };

    function refresh(){
      if(view==="list"){ $("list").style.display="block"; $("timetable").style.display="none"; load(); }
      else { $("list").style.display="none"; $("timetable").style.display="block"; loadTimetable(); }
    }
    $("v-list").onclick=function(){ view="list"; $("v-list").classList.add("on"); $("v-grid").classList.remove("on"); refresh(); };
    $("v-grid").onclick=function(){ view="grid"; $("v-grid").classList.add("on"); $("v-list").classList.remove("on"); refresh(); };

    $("btn-reload").onclick=refresh;
    ["f-date","f-ther","f-status","f-source"].forEach(function(idv){ $(idv).addEventListener("change",refresh); });
  </script>
  <script>
  /* ===== セラピスト管理（週間出勤表・出勤の登録・個別ページ） ===== */
  (function(){
    var STEP_TIMES = (function(){ var a=[]; for(var m=600;m<=1740;m+=30){ var h=Math.floor(m/60), mm=m%60; a.push((h>=24?"翌"+(h-24):h)+":"+(mm<10?"0":"")+mm); } return a; })();
    var shData = null, shCur = null, tdName = "";
    function slashToInput(s){ var m=String(s||"").match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/); if(!m) return ""; var p=function(n){return String(n).padStart(2,"0");}; return m[1]+"-"+p(m[2])+"-"+p(m[3]); }
    function addDaysInput(v,n){ var d=new Date(v+"T00:00:00"); d.setDate(d.getDate()+n); var p=function(x){return String(x).padStart(2,"0");}; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
    function splitTime(t){ var m=String(t||"").match(/(.+?)\s*[〜~\-]\s*(.+)/); return m?[m[1].trim(),m[2].trim()]:[String(t||"").trim(),""]; }
    function fillTimes(sel, val){
      var opts=STEP_TIMES.slice(); if(val && opts.indexOf(val)<0) opts.unshift(val);
      sel.innerHTML=opts.map(function(t){ return '<option'+(t===val?' selected':'')+'>'+esc(t)+'</option>'; }).join("");
    }
    function setSelect(sel, val){ if(!val) return; var has=[].some.call(sel.options,function(o){return o.value===val;}); if(!has){ var o=document.createElement("option"); o.textContent=val; sel.appendChild(o);} sel.value=val; }

    // ---- ページ切替 ----
    function showPage(th){
      $("page-bk").style.display = th?"none":"block";
      $("page-th").style.display = th?"block":"none";
      $("tab-bk").classList.toggle("on", !th); $("tab-th").classList.toggle("on", th);
      if(th && !shData) loadShifts();
    }
    $("tab-bk").onclick=function(){ showPage(false); };
    $("tab-th").onclick=function(){ showPage(true); };

    // ---- 週間出勤表 ----
    $("th-from").value = todayStr();
    function loadShifts(){
      $("th-grid").innerHTML='<div class="loading">読み込み中…</div>';
      google.script.run.withSuccessHandler(renderShifts)
        .withFailureHandler(function(e){ $("th-grid").innerHTML='<div class="err">'+esc(e&&e.message?e.message:e)+'</div>'; })
        .adminShifts(dateInputToSlash($("th-from").value), 7);
    }
    function renderShifts(res){
      if(!res||!res.ok){ $("th-grid").innerHTML='<div class="err">'+esc((res&&res.reason)||"取得に失敗しました")+'</div>'; return; }
      shData=res;
      var map={}; res.shifts.forEach(function(s,i){ map[s.name+"|"+s.date]=i; });
      var today=dateInputToSlash(todayStr());
      var working=res.shifts.filter(function(s){return !s.absent&&!s.draft;}).length;
      $("th-summary").textContent = res.names.length+"名 ／ この週の出勤 "+working+"件";
      $("sh-names").innerHTML = res.names.map(function(n){return '<option value="'+esc(n).replace(/"/g,"&quot;")+'">';}).join("");
      var h='<div class="tt-wrap"><table class="sg"><thead><tr><th class="nm" style="padding:6px">セラピスト</th>';
      res.dates.forEach(function(d){ h+='<th'+(d.date===today?' class="today"':'')+'>'+esc(d.label)+'</th>'; });
      h+='</tr></thead><tbody>';
      res.names.forEach(function(n,ni){
        h+='<tr><th class="nm"><button data-ther="'+ni+'">'+esc(n)+'</button></th>';
        res.dates.forEach(function(d,di){
          var idx=map[n+"|"+d.date], cls="sc"+(d.date===today?" today":"");
          if(idx==null){ h+='<td class="'+cls+'" data-n="'+ni+'" data-d="'+di+'"><span class="plus">＋</span></td>'; return; }
          var s=res.shifts[idx];
          if(s.absent){ h+='<td class="'+cls+' off" data-s="'+idx+'"><span class="t">休み</span><small>'+esc(s.time)+'</small></td>'; return; }
          if(s.draft){ h+='<td class="'+cls+' draft" data-s="'+idx+'"><span class="t">'+esc(s.time)+'</span><small>'+esc(s.kbn||"申請中")+'</small></td>'; return; }
          h+='<td class="'+cls+' on" data-s="'+idx+'"><span class="t">'+esc(s.time)+'</span><small>'+esc(s.status||"")+'</small></td>';
        });
        h+='</tr>';
      });
      h+='</tbody></table></div>';
      if(!res.names.length) h='<div class="empty">セラピストがまだいません。「＋ 出勤を登録」から追加できます。</div>';
      $("th-grid").innerHTML=h;
    }
    $("th-grid").addEventListener("click", function(ev){
      var b=ev.target.closest("[data-ther]"); if(b){ openTherapist(shData.names[+b.getAttribute("data-ther")]); return; }
      var td=ev.target.closest("td.sc"); if(!td||!shData) return;
      if(td.hasAttribute("data-s")) openShift(shData.shifts[+td.getAttribute("data-s")]);
      else openShift({ name: shData.names[+td.getAttribute("data-n")], date: shData.dates[+td.getAttribute("data-d")].date });
    });
    $("th-prev").onclick=function(){ $("th-from").value=addDaysInput($("th-from").value,-7); loadShifts(); };
    $("th-next").onclick=function(){ $("th-from").value=addDaysInput($("th-from").value,7); loadShifts(); };
    $("th-today").onclick=function(){ $("th-from").value=todayStr(); loadShifts(); };
    $("th-reload").onclick=loadShifts;
    $("th-from").addEventListener("change", loadShifts);
    $("th-new").onclick=function(){ openShift({ date: dateInputToSlash($("th-from").value) }); };

    // ---- 出勤の登録/変更 ----
    function openShift(s){
      shCur = s && s.row ? s : null;
      var tt = splitTime(s&&s.time);
      $("sh-title").textContent = shCur ? "出勤の変更" : "出勤の登録";
      $("sh-name").value = (s&&s.name)||"";
      $("sh-date").value = slashToInput(s&&s.date) || todayStr();
      fillTimes($("sh-start"), tt[0] || "13:00");
      fillTimes($("sh-end"), tt[1] || "翌2:00");
      $("sh-status").value="空きあり"; setSelect($("sh-status"), shCur&&shCur.status);
      $("sh-kbn").value="確定"; setSelect($("sh-kbn"), shCur&&shCur.draft ? shCur.kbn : "");
      $("sh-del").style.display = shCur ? "inline-block" : "none";
      $("sh-absent").style.display = shCur ? "inline-block" : "none";
      $("sh-absent").textContent = shCur&&shCur.absent ? "出勤に戻す" : "休みにする";
      $("sh-state").textContent = shCur&&shCur.absent
        ? "※ 現在「休み」です。保存すると出勤に戻ります。"
        : "※「申請中」「希望休」はサイトに表示されず、WEB・LINEの予約も受け付けません。";
      $("sh-bg").classList.add("on");
    }
    function shiftDone(msg){
      return function(res){
        if(res&&res.ok){
          toast(msg); $("sh-bg").classList.remove("on"); loadShifts();
          if(tdName && $("td-bg").classList.contains("on")) openTherapist(tdName);
          if(res.warning) setTimeout(function(){ alert("⚠ "+res.warning); }, 50);
        } else alert("できませんでした："+((res&&res.reason)||"不明"));
      };
    }
    function shiftFail(e){ alert("エラー："+(e&&e.message?e.message:e)); }
    $("sh-close").onclick=function(){ $("sh-bg").classList.remove("on"); };
    $("sh-save").onclick=function(){
      var p={ name:$("sh-name").value.trim(), date:dateInputToSlash($("sh-date").value), start:$("sh-start").value, end:$("sh-end").value, status:$("sh-status").value, kbn:$("sh-kbn").value };
      if(!p.name){ alert("セラピストを入力してください。"); return; }
      if(shCur){ p.row=shCur.row; p.origName=shCur.name; p.origDate=shCur.date; }
      google.script.run.withSuccessHandler(shiftDone("出勤を保存しました")).withFailureHandler(shiftFail).adminShiftSave(p);
    };
    $("sh-absent").onclick=function(){
      if(!shCur) return;
      var toAbsent=!shCur.absent;
      if(toAbsent && !confirm(shCur.name+"さんの "+shCur.date+" を「休み」にします。よろしいですか？")) return;
      google.script.run.withSuccessHandler(shiftDone(toAbsent?"休みにしました":"出勤に戻しました")).withFailureHandler(shiftFail)
        .adminShiftSetAbsent({ row:shCur.row, name:shCur.name, date:shCur.date, absent:toAbsent });
    };
    $("sh-del").onclick=function(){
      if(!shCur) return;
      if(!confirm(shCur.name+"さんの "+shCur.date+" の出勤を削除します。よろしいですか？\n（休みの場合は「休みにする」をお使いください）")) return;
      google.script.run.withSuccessHandler(shiftDone("削除しました")).withFailureHandler(shiftFail)
        .adminShiftDelete({ row:shCur.row, name:shCur.name, date:shCur.date });
    };

    // ---- 個別ページ ----
    function openTherapist(name){
      tdName=name;
      $("td-title").textContent=name+" さん";
      $("td-body").innerHTML='<div class="loading">読み込み中…</div>';
      $("td-bg").classList.add("on");
      google.script.run.withSuccessHandler(renderTherapist)
        .withFailureHandler(function(e){ $("td-body").innerHTML='<div class="err">'+esc(e&&e.message?e.message:e)+'</div>'; })
        .adminTherapistDetail(name);
    }
    function renderTherapist(res){
      if(!res||!res.ok){ $("td-body").innerHTML='<div class="err">'+esc((res&&res.reason)||"取得に失敗しました")+'</div>'; return; }
      var h='<div><span class="stat">今月の確定予約<b>'+res.counts.thisMonth+'</b>件</span><span class="stat">今後の予約<b>'+res.counts.upcoming+'</b>件</span></div>';
      h+='<div class="sec-h">出勤予定（今日から2週間）</div>';
      if(!res.shifts.length) h+='<div class="note">登録された出勤はありません。</div>';
      res.shifts.forEach(function(s,i){
        var st = s.absent ? '<span class="pill st-cancelled">休み</span>' : s.draft ? '<span class="pill st-tentative">申請中・希望休</span>' : '<span class="pill st-confirmed">出勤</span>';
        h+='<div class="li click" data-tds="'+i+'"><b>'+esc(s.label)+'</b> '+esc(s.time)+' '+st+(s.status&&!s.absent?' <small>'+esc(s.status)+'</small>':'')+'</div>';
      });
      h+='<div class="sec-h">今後の予約</div>';
      if(!res.bookings.length) h+='<div class="note">今後の予約はありません。</div>';
      res.bookings.forEach(function(b){
        h+='<div class="li"><b>'+esc(b.start.slice(5))+'〜'+esc(b.end.split(" ")[1])+'</b> <span class="pill st-'+esc(b.status)+'">'+esc(b.statusLabel)+'</span> <span class="src">'+esc(b.source)+'</span> '+esc(b.customerName||"（名前なし）")+' / '+esc(b.course||"")+'</div>';
      });
      if(res.profile.length){
        h+='<div class="sec-h">プロフィール（名簿シート）</div><dl class="kv">';
        res.profile.forEach(function(x){ h+='<dt>'+esc(x.label)+'</dt><dd>'+esc(x.value)+'</dd>'; });
        h+='</dl>';
      }
      $("td-body").innerHTML=h;
      $("td-body").__shifts=res.shifts;
    }
    $("td-body").addEventListener("click", function(ev){
      var li=ev.target.closest("[data-tds]"); if(!li) return;
      var s=$("td-body").__shifts[+li.getAttribute("data-tds")];
      openShift({ row:s.row, name:tdName, date:s.date, time:s.time, status:s.status, absent:s.absent, draft:s.draft, kbn:s.draft?"申請中":"" });
    });
    $("td-close").onclick=function(){ $("td-bg").classList.remove("on"); };
    $("td-add").onclick=function(){ openShift({ name: tdName, date: dateInputToSlash(todayStr()) }); };
  })();
  </script>
</body>
